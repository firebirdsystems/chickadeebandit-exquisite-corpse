<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exquisite Corpse</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: var(--hub-bg, #f9fafb);
      --surface: var(--hub-surface, #ffffff);
      --border: var(--hub-border, #e5e7eb);
      --border-mid: var(--hub-border, #d1d5db);
      --text: var(--hub-text, #000000);
      --muted: var(--hub-text-muted, #6b7280);
      --accent: var(--hub-primary, #6d28d9);
      --accent-hover: var(--hub-primary-hover, #5b21b6);
      --accent-fg: var(--hub-primary-fg, #ffffff);
      --radius: var(--hub-radius, 10px);
      --green: #047857;
      --green-soft: #d1fae5;
      --amber: #b45309;
      --amber-soft: #fef3c7;
      --red: #b91c1c;
      --red-soft: #fee2e2;
      --violet-soft: #ede9fe;
      --shadow: 0 1px 3px rgba(15, 23, 42, .07);
    }
    body {
      min-height: 100vh; background: var(--bg); color: var(--text);
      font-family: var(--hub-font, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
      font-size: var(--hub-font-size, 15px); line-height: 1.5;
    }
    .app { max-width: 720px; margin: 0 auto; padding: 16px; }
    .topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    h1 { font-size: 1.35rem; line-height: 1.2; }
    h2 { font-size: 1rem; margin-bottom: 10px; }
    .muted { color: var(--muted); }
    .tiny { font-size: .78rem; }
    .stack { display: grid; gap: 12px; }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px;
    }
    .round-card { cursor: pointer; transition: border-color .15s, box-shadow .15s; }
    .round-card:hover { border-color: var(--accent); box-shadow: 0 5px 14px rgba(15, 23, 42, .08); }
    .head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .title { font-weight: 750; font-size: 1rem; }
    .meta { margin-top: 3px; color: var(--muted); font-size: .82rem; }
    .progress { height: 8px; overflow: hidden; border-radius: 999px; background: #eef2f7; margin-top: 10px; }
    .progress > span { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .2s; }
    .pill {
      display: inline-flex; align-items: center; justify-content: center; min-height: 24px;
      padding: 2px 9px; border-radius: 999px; background: #f1f5f9; color: var(--muted);
      font-size: .74rem; font-weight: 700; white-space: nowrap;
    }
    .pill.good { background: var(--green-soft); color: var(--green); }
    .pill.warn { background: var(--amber-soft); color: var(--amber); }
    .pill.info { background: var(--violet-soft); color: var(--accent); }
    .section-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 6px 2px 10px; }
    .section-head h2 { margin-bottom: 0; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      border: 1px solid transparent; border-radius: 8px; padding: 8px 12px;
      font: inherit; font-size: .86rem; font-weight: 700; cursor: pointer;
      min-height: 38px; background: var(--accent); color: var(--accent-fg);
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:disabled { opacity: .48; cursor: default; }
    .btn-ghost { background: transparent; color: var(--text); border-color: var(--border-mid); }
    .btn-ghost:hover { background: #f8fafc; }
    .btn-danger { background: var(--red-soft); color: var(--red); border-color: transparent; }
    .btn-danger:hover { background: #fecaca; }
    .btn-quiet { min-height: 28px; padding: 3px 8px; background: transparent; color: var(--muted); border: 0; font-size: .76rem; font-weight: 700; }
    .btn-quiet:hover { color: var(--text); }
    .btn-sm { min-height: 31px; padding: 5px 9px; font-size: .78rem; }
    .back { margin-bottom: 10px; }
    .form { display: grid; gap: 12px; }
    .field { display: grid; gap: 4px; }
    label { font-size: .76rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 800; }
    input, textarea {
      width: 100%; border: 1.5px solid var(--border-mid); border-radius: 8px;
      padding: 9px 11px; font: inherit; background: var(--surface); color: var(--text);
    }
    textarea { min-height: 60px; resize: vertical; }
    input:focus, textarea:focus { outline: none; border-color: var(--accent); }
    .members { display: grid; gap: 6px; }
    .member-pick {
      display: flex; align-items: center; gap: 10px; padding: 8px 10px;
      border: 1.5px solid var(--border); border-radius: 8px; cursor: pointer;
    }
    .member-pick input { width: auto; }
    .roster { display: grid; gap: 6px; }
    .roster-row { display: flex; align-items: center; gap: 8px; font-size: .86rem; }
    .roster-row.now { font-weight: 750; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--border-mid); flex: none; }
    .dot.done { background: var(--green); }
    .dot.now { background: var(--accent); box-shadow: 0 0 0 3px var(--violet-soft); }
    .avatar {
      width: 26px; height: 26px; border-radius: 50%; display: inline-flex;
      align-items: center; justify-content: center; color: #fff; font-size: .72rem; font-weight: 800; flex: none;
    }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .empty, .loading { color: var(--muted); text-align: center; padding: 32px 16px; }
    .error { background: var(--red-soft); color: var(--red); padding: 9px 12px; border-radius: 8px; margin-bottom: 10px; font-size: .86rem; }
    .notice { background: var(--amber-soft); color: var(--amber); padding: 9px 12px; border-radius: 8px; margin-bottom: 10px; font-size: .86rem; }
    .canvas-wrap { border: 1.5px solid var(--border-mid); border-radius: 10px; overflow: hidden; background: #fff; touch-action: none; }
    canvas { display: block; width: 100%; touch-action: none; cursor: crosshair; }
    .tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px; }
    .swatches { display: flex; gap: 6px; }
    .swatch { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--border); cursor: pointer; padding: 0; }
    .swatch.on { border-color: var(--text); transform: scale(1.12); }
    .sizes { display: flex; gap: 6px; }
    .size-btn { width: 34px; height: 30px; border: 1.5px solid var(--border-mid); border-radius: 8px; background: var(--surface); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
    .size-btn.on { border-color: var(--accent); background: var(--violet-soft); }
    .size-dot { border-radius: 50%; background: var(--text); }
    .gallery { display: grid; gap: 0; border: 1.5px solid var(--border); border-radius: 10px; overflow: hidden; background: #fff; }
    .panel { border-top: 1px dashed var(--border); }
    .panel:first-child { border-top: 0; }
    .panel img { display: block; width: 100%; }
    .panel-by { font-size: .72rem; color: var(--muted); padding: 4px 8px; background: #fafafa; }
    .hint { background: var(--violet-soft); color: var(--accent); padding: 10px 12px; border-radius: 8px; font-size: .84rem; }
    @media (max-width: 560px) {
      .topbar, .head { align-items: stretch; flex-direction: column; }
      .actions .btn { flex: 1; }
    }
    .search-row { margin-bottom: 12px; }
    .search-input {
      width: 100%; border: 1.5px solid var(--border-mid, var(--border, #d1d5db));
      border-radius: 8px; padding: 9px 11px; font: inherit;
      background: var(--surface, var(--card, #fff)); color: var(--text, inherit);
    }
    .search-input:focus { outline: none; border-color: var(--accent, #6366f1); }
  </style>
  <base href="/run/exquisite-corpse/">
</head>
<body>
<div class="app">
  <div id="root" class="loading">Loading…</div>
</div>

<script type="module">
import { esc, isAdult, memberColor, initial, hubConfirm, hubAlert, createFilesHelper, sendHubNotification, hubAppUrl, searchMatch } from "/hub-sdk.js";
import {
  orderedSegments, mySegment, panelCount, topHandoffId, submitDecision,
  roundProgress, artistIds, lastConnectors,
  canSubmit as _canSubmit, canManageRound as _canManage,
  canReveal as _canReveal, computeConnectors, searchableFields,
} from "./logic.js";

const CONTEXT    = window.__CONTEXT_URL ?? "";
const DB         = window.__DB_URL ?? "";
const FILES_URL  = window.__FILES_URL ?? "";
const ME         = window.__CURRENT_MEMBER ?? null;
const APP_ID     = window.__APP_ID ?? "exquisite-corpse";
const EVENTS_URL = window.__EVENTS_URL ?? "/api/events";
const files      = createFilesHelper(FILES_URL);

const PALETTE = ["#111827", "#dc2626", "#ea580c", "#ca8a04", "#16a34a", "#2563eb", "#7c3aed", "#db2777"];
const SIZES   = [3, 6, 12];
const BAND    = 26; // px above the bottom edge treated as the hand-off seam

let members = [];
let memberMap = new Map();
let currentMember = null;
let rounds = [];
let searchQ = "";       // in-app search (see logic.js searchableFields)
let segments = [];
let handoffs = [];
let selectedRoundId = null;
let view = "list";
let showArchived = false;
let error = "";
let notice = "";

// drawing state
let strokes = [];
let activeStroke = null;
let tool = "pen"; // "pen" | "eraser"
let penColor = PALETTE[0];
let penSize = SIZES[1];
let canvasRoundKey = null; // resets strokes when switching canvases
// The panel count as it stood when the artist laid down their FIRST stroke —
// the moment they committed to the ghost marks then on screen.
//
// Not sampled at submit: Back → Refresh → reopen reloads `handoffs` while the
// strokes survive (the canvas is keyed on the round alone), so the submit-time
// count is already fresh and nothing looks to have arrived.
//
// Not sampled at canvas setup either: opening a round and then hitting Refresh
// repaints the new ticks without resampling (the key is unchanged), so the
// artist draws to the CURRENT marks and is then told two panels arrived while
// they worked. The first stroke is the only point where what is on screen and
// what the artist is answering are the same thing.
let canvasDrawnAgainst = 0;
// …and WHICH hand-off was above at that moment. The id is what decides whether
// to ask at submit: a member leaving deletes their hand-off, so a departure and
// an arrival in the same window cancel out in the count while the edge being
// continued has actually changed.
let canvasDrawnAgainstId = null;
// Set when the artist cancels out of a "the marks moved" confirm. Rebaselining
// there and then would let the very next Submit — with nothing redrawn — sail
// through and stack the mismatched panel silently. Instead the baseline moves
// on the next STROKE: answering the new marks is what drawing to them means,
// and submitting again unchanged asks the same question again, correctly.
let rebaselineOnNextStroke = false;
// The ghost marks exactly as they were painted when the baseline was taken.
// Held rather than recomputed so that "the baseline is the ghost on screen"
// stays true for the whole life of a drawing: `redrawCanvas` runs on every
// render, and letting it repaint from current state would change the marks
// under the artist's pen and then accuse them of ignoring marks they were
// never shown. Surviving the row's deletion is a bonus — a departed member's
// marks stay on screen until the artist submits and is told they went.
let canvasGhost = [];

// thin wrappers binding pure logic to the current member
function memberIds() { return members.map((m) => m.id); }
function canSubmit(round) { return _canSubmit(round, segments, handoffs, currentMember, memberIds()); }
function canManageRound(round) { return _canManage(round, currentMember); }
function canReveal(round) { return _canReveal(round, handoffs, currentMember); }
function progressOf(round) { return roundProgress(round, handoffs, memberIds()); }

function nowIso() { return new Date().toISOString(); }
function uid(prefix) { return `${prefix}-${crypto.randomUUID()}`; }
function fmtWhen(v) {
  if (!v) return "";
  try { return new Intl.DateTimeFormat(undefined, { month: "short", day: "numeric" }).format(new Date(v)); }
  catch { return ""; }
}
function memberName(id) { return memberMap.get(id)?.name ?? "Someone"; }
function selectedRound() { return rounds.find((r) => r.id === selectedRoundId) ?? null; }
function roundSegments(id) { return orderedSegments(segments, id); }

async function dbq(sql, params = []) {
  if (!DB) return { rows: [] };
  const res = await fetch(DB, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ sql, params }),
  });
  const json = await res.json();
  if (json.error) throw new Error(json.error);
  return json;
}

async function loadMembers() {
  if (!CONTEXT) {
    members = [
      { id: "demo-1", name: "Alex", role: "adult" },
      { id: "demo-2", name: "Jordan", role: "adult" },
      { id: "demo-3", name: "Casey", role: "child" },
      { id: "demo-4", name: "Riley", role: "child" },
    ];
  } else {
    try {
      const res = await fetch(`${CONTEXT}?keys=family.members`);
      members = ((await res.json())["family.members"]) ?? [];
    } catch { members = []; }
  }
  memberMap = new Map(members.map((m) => [m.id, m]));
  currentMember = ME ?? members[0] ?? { id: "guest", name: "Guest", role: "adult" };
}

function seedDemo() {
  const rid = "demo-round";
  rounds = [{
    id: rid, title: "The Beast of Maple Street", theme: "A creature nobody has seen",
    visibility: "everyone", status: "open",
    panel_height: 300, created_by_id: "demo-1", created_by_name: "Alex",
    created_at: nowIso(), revealed_at: null, archived: 0,
  }];
  // Alex (demo-1) already drew the head; anyone else who is ready may go next.
  segments = [{
    id: "demo-seg-1", round_id: rid, member_id: "demo-1", member_name: "Alex",
    position: 0, file_id: "", file_url: placeholderPanel("Head", "#ede9fe"), created_at: nowIso(),
  }];
  handoffs = [{
    id: "demo-ho-1", round_id: rid, member_id: "demo-1", position: 0,
    connectors: JSON.stringify([{ x: 0.35, color: "#7c3aed" }, { x: 0.62, color: "#7c3aed" }]),
    created_at: nowIso(),
  }];
}

function placeholderPanel(label, bg) {
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='600' height='300'><rect width='600' height='300' fill='${bg}'/><text x='300' y='155' font-family='sans-serif' font-size='28' fill='#6d28d9' text-anchor='middle'>${label}</text></svg>`;
  return `data:image/svg+xml;utf8,${encodeURIComponent(svg)}`;
}

async function loadData() {
  if (!DB) { if (!rounds.length) seedDemo(); return; }
  const [r, s, h] = await Promise.all([
    dbq("SELECT * FROM app_exquisite_corpse__rounds WHERE archived = ? ORDER BY created_at DESC", [showArchived ? 1 : 0]),
    dbq("SELECT * FROM app_exquisite_corpse__segments ORDER BY position ASC, created_at ASC"),
    dbq("SELECT * FROM app_exquisite_corpse__handoffs ORDER BY position ASC"),
  ]);
  rounds = r.rows;
  segments = s.rows;
  handoffs = h.rows;
}

/**
 * Re-read the shared state for one round. Used immediately before claiming a
 * panel slot: the in-memory `handoffs` array can be minutes old, and the
 * realistic collision here is not two people submitting in the same second —
 * it is one tab left open while somebody else's panel landed. Returns the
 * round's current row, or null if it has gone away entirely.
 */
async function refreshRoundState(roundId) {
  if (!DB) return rounds.find((r) => r.id === roundId) ?? null;
  // Scoped to this round and merged into what we already hold. It used to
  // re-read every segment and hand-off in the app, which was tolerable when
  // only submit called it and is not now that opening any round card does.
  const [r, s, h] = await Promise.all([
    dbq("SELECT * FROM app_exquisite_corpse__rounds WHERE id = ?", [roundId]),
    dbq("SELECT * FROM app_exquisite_corpse__segments WHERE round_id = ? ORDER BY position ASC, created_at ASC", [roundId]),
    dbq("SELECT * FROM app_exquisite_corpse__handoffs WHERE round_id = ? ORDER BY position ASC", [roundId]),
  ]);
  segments = [...segments.filter((x) => x.round_id !== roundId), ...s.rows];
  handoffs = [...handoffs.filter((x) => x.round_id !== roundId), ...h.rows];
  // Updated in place, never evicted. An earlier version dropped a round whose
  // archived state no longer matched the list filter, which bounced an artist
  // out to the list mid-submit and left canvasRoundKey/strokes pointing at a
  // round that was no longer in `rounds`. Keeping the row and letting the list
  // do its own filtering (see visibleRounds) gets the same result without
  // destroying the view someone is standing in.
  const fresh = r.rows[0] ?? null;
  const idx = rounds.findIndex((x) => x.id === roundId);
  if (fresh && idx !== -1) rounds[idx] = fresh;
  return fresh;
}

async function refresh() {
  clearMessages();
  try {
    await loadMembers();
    await loadData();
    if (selectedRoundId && !rounds.some((r) => r.id === selectedRoundId)) selectedRoundId = null;
    render();
  } catch (e) {
    error = e.message; render();
  }
}

function clearMessages() { error = ""; notice = ""; }
function showError(m) { error = m; notice = ""; render(); }
function showNotice(m) { notice = m; error = ""; render(); }

// ── Mutations ─────────────────────────────────────────────────────────────────
async function createRound(form) {
  const title = form.title.value.trim();
  const theme = form.theme.value.trim();
  if (!title) return showError("Give your drawing a title.");

  const round = {
    id: uid("round"), title, theme, visibility: "everyone", status: "open",
    panel_height: 300,
    created_by_id: currentMember.id, created_by_name: currentMember.name,
    created_at: nowIso(), revealed_at: null, archived: 0,
  };
  try {
    await dbq(
      `INSERT INTO app_exquisite_corpse__rounds
         (id, title, theme, visibility, status, panel_height, created_by_id, created_by_name, created_at, archived)
       VALUES (?, ?, ?, 'everyone', 'open', ?, ?, ?, ?, 0)`,
      [round.id, round.title, round.theme, round.panel_height, round.created_by_id, round.created_by_name, round.created_at]
    );
    rounds = [round, ...rounds];
    selectedRoundId = round.id;
    view = "list";
    showNotice("Drawing started — anyone can add the first panel.");
    publish("exquisite_corpse.round_created", round.id, { title });
    // Everyone else is invited, because everyone else may draw. There is no
    // first artist to single out any more.
    const audience = members.map((m) => m.id).filter((id) => id !== currentMember.id);
    if (audience.length) {
      notify(audience, `New drawing: ${title}`, `${currentMember.name} started a drawing — add a panel whenever you're ready.`, round.id);
    }
  } catch (e) { showError(e.message); }
}

// Wording for each submitDecision outcome. Split out so the decision stays a
// pure function and this stays a lookup — showError/hubConfirm escape their own
// text, so nothing here re-escapes.
const BLOCKED_MESSAGE = {
  unknown_member: () => "We couldn't tell who you are — reload and try again.",
  already_drawn: () => "Your panel for this drawing is already in — it's one each.",
  round_closed: (round) =>
    `${round.created_by_name} closed this drawing while you were drawing. Your panel can't be added.`,
};

const CONFIRM_COPY = {
  replaced: () => ({
    message: "The panel above yours went away while you were drawing.",
    description: "Whoever drew it is no longer on the roster, so your top edge continues marks that aren't there any more. Add it anyway, or cancel — the current marks are on your canvas and you can draw to those instead.",
    confirmLabel: "Add it anyway",
  }),
  arrived: ({ arrived }) => ({
    // `arrived` is a NET count and can be 0 here — someone below left in the
    // same window that a panel landed on top. One panel is what they see.
    message: `${arrived > 1 ? `${arrived} panels` : "A panel"} arrived while you were drawing.`,
    description: "Your top edge continues the panel that used to be last, so it won't line up with what's above you now. Add it anyway, or cancel — the new marks are on your canvas and you can draw to those instead.",
    confirmLabel: "Add it anyway",
  }),
};

/**
 * Everything that happens once a panel is known to be committed: the declared
 * event, the host's nudge, and the artist's confirmation. Shared by the normal
 * path and the SubmitLanded recovery — a panel that definitely landed must not
 * skip its event or leave a finished round with nobody told, just because the
 * response to the insert went missing.
 *
 */
function announceSubmission(round, pos) {
  const { complete } = progressOf(round);
  publish("exquisite_corpse.segment_added", round.id, { position: pos });
  if (complete) {
    showNotice("Your panel is in — everyone has drawn. The host can reveal it now!");
    if (round.created_by_id !== currentMember.id) {
      notify([round.created_by_id], `Ready to reveal: ${round.title}`, "Everyone has drawn their panel. Tap to reveal the finished piece.", round.id);
    }
  } else {
    showNotice("Your panel is sealed. Someone else can pick it up whenever they're ready.");
  }
}

// Thrown when a hand-off insert reports failure but turns out to have
// committed: the submit succeeded and must not be rolled back or re-reported.
class SubmitLanded extends Error {
  constructor(roundId, position, handoff) {
    super("submit landed");
    this.roundId = roundId;
    this.position = position;
    this.handoff = handoff;
  }
}

async function submitSegment() {
  const round = selectedRound();
  if (!round || !canSubmit(round)) return showError("You can't add a panel to this drawing.");
  const canvas = document.getElementById("draw");
  if (!canvas) return;
  if (!strokes.length) return showError("Draw something before passing it on.");
  // Measured NOW, while the element is still in the document. Two awaits follow
  // (the re-read and the confirm dialog), and hitting Back during either
  // detaches the canvas — clientWidth then reads 0 and computeConnectors
  // returns [], which would submit a panel leaving no marks for the next
  // artist. The bitmap survives detachment, so only the layout read is at risk.
  const canvasWidth = canvas.clientWidth;
  if (!canvasWidth) return showError("Couldn't measure the canvas — try again.");

  const btn = document.getElementById("submit-btn");
  if (btn) { btn.disabled = true; btn.textContent = "Checking…"; }

  // Captured when this canvas started taking strokes — see canvasDrawnAgainst.
  const drawnAgainst = canvasDrawnAgainst;
  let fresh;
  try {
    fresh = await refreshRoundState(round.id);
  } catch (e) { return showError(e.message); }
  if (!fresh) return showError("This drawing is no longer here.");

  // Two artists submitting in the same instant can still both land on the same
  // slot, and both panels are kept. The segment and the hand-off are separate
  // INSERTs with no transaction between them, so a UNIQUE(round_id, position)
  // guard would take the loser's hand-off after their segment had already
  // landed and strand a finished drawing behind the one-panel-per-member rule
  // with no way to retry. Two panels continuing one edge is the cheaper
  // failure in a game about seams that don't line up; a discarded drawing is
  // not. What the re-read above buys is the far commoner case — a tab left
  // open — which is now answered instead of silently stacked.
  const decision = submitDecision({
    round: fresh, segments, handoffs, me: currentMember, memberIds: memberIds(),
    drawnAgainst, drawnAgainstId: canvasDrawnAgainstId,
  });
  if (decision.action === "blocked") {
    return showError(BLOCKED_MESSAGE[decision.reason](fresh));
  }
  if (decision.action === "confirm") {
    const ok = await hubConfirm(CONFIRM_COPY[decision.kind](decision, fresh));
    if (!ok) {
      // Keeping their strokes and drawing on. render() repaints the ghost from
      // the state just read; the baseline moves when they actually draw to it.
      rebaselineOnNextStroke = true;
      render();
      return;
    }
  }

  // Re-checked after the awaits: Clear (or Undo back to nothing) can run while
  // the re-read or the dialog is open, and both the stroke list and the bitmap
  // go blank together. Submitting then burns this member's one panel on an
  // empty image with no connectors, which max_per_member makes unrepairable.
  if (!strokes.length) return showError("Your canvas was cleared — draw something before passing it on.");

  const pos = decision.position;
  const connectors = computeConnectors(strokes, canvasWidth, fresh.panel_height, BAND);
  if (btn) { btn.disabled = true; btn.textContent = "Passing it on…"; }

  try {
    let fileId = "";
    let fileUrl;
    if (FILES_URL) {
      const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/png"));
      if (!blob) throw new Error("Could not capture the drawing.");
      const up = await files.upload(new File([blob], `${fresh.id}-${pos}.png`, { type: "image/png" }));
      fileId = up.id; fileUrl = up.url;
    } else {
      fileUrl = canvas.toDataURL("image/png"); // demo mode
    }

    const seg = {
      id: uid("seg"), round_id: fresh.id, member_id: currentMember.id, member_name: currentMember.name,
      position: pos, file_id: fileId, file_url: fileUrl, created_at: nowIso(),
    };
    const ho = {
      id: uid("ho"), round_id: fresh.id, member_id: currentMember.id, position: pos,
      connectors: JSON.stringify(connectors), created_at: nowIso(),
    };
    if (DB) {
      await dbq(
        `INSERT INTO app_exquisite_corpse__segments
           (id, round_id, member_id, member_name, position, file_id, file_url, created_at)
         VALUES (?, ?, ?, ?, ?, ?, ?, ?)`,
        [seg.id, seg.round_id, seg.member_id, seg.member_name, seg.position, seg.file_id, seg.file_url, seg.created_at]
      );
      try {
        await dbq(
          `INSERT INTO app_exquisite_corpse__handoffs (id, round_id, member_id, position, connectors, created_at)
           VALUES (?, ?, ?, ?, ?, ?)`,
          [ho.id, ho.round_id, ho.member_id, ho.position, ho.connectors, ho.created_at]
        );
      } catch (handoffError) {
        // Did it actually land? A response lost after a successful commit looks
        // identical from here to an insert that never ran, and the two want
        // opposite repairs. Ask the server before undoing anything.
        let present = null; // true | false | null = could not tell
        try {
          const check = await dbq("SELECT id FROM app_exquisite_corpse__handoffs WHERE id = ?", [ho.id]);
          present = ((check.rows ?? []).length > 0);
        } catch { present = null; }
        if (present !== false) {
          // Either it committed — nothing to undo — or we cannot tell, in which
          // case leaving both rows is the safer half of the trade. An orphan
          // SEGMENT still shows up in the reveal gallery and costs only
          // bookkeeping; an orphan HAND-OFF (which rolling back would create if
          // the insert really did commit) counts a panel that has no image,
          // misfeeds the next artist, and is blocked from repair by
          // max_per_member. Never risk creating one to tidy up the other.
          if (present === true) throw new SubmitLanded(fresh.id, pos, ho);
          throw new Error(
            "Your panel saved but we couldn't confirm it was passed on. "
            + "Reload to check before drawing anything else."
          );
        }
        // The panel landed; the hand-off that publishes it to everyone else did
        // not. There is no transaction across the two, and leaving the segment
        // behind is the worst of the available states: one-panel-per-member
        // blocks every retry (the next re-read pulls the orphan into
        // `segments`, so submit answers already_drawn forever), the count
        // under-reports the panel, the artist shows as "not yet" on the roster,
        // and the next artist continues marks that were never published.
        // Take the panel back out so a retry is simply possible — the row
        // delete also reclaims the uploaded file (manifest delete_file_columns).
        try {
          await dbq("DELETE FROM app_exquisite_corpse__segments WHERE id = ?", [seg.id]);
        } catch {
          throw new Error(
            "Your panel saved but couldn't be passed on, and undoing it failed too. "
            + "Reload before trying again — don't redraw yet."
          );
        }
        const why = handoffError?.message ? ` (${handoffError.message})` : "";
        throw new Error(`Couldn't pass the drawing on, so nothing was saved${why}. Try submitting again.`);
      }
    }
    segments = [...segments, seg];
    handoffs = [...handoffs, ho];
    strokes = [];
    canvasRoundKey = null;

    announceSubmission(fresh, pos);
  } catch (e) {
    if (e instanceof SubmitLanded) {
      // The panel is in. Everything after the inserts is local bookkeeping the
      // next load redoes anyway, so retire the canvas and reload rather than
      // telling an artist their finished panel failed. The canvas state is
      // cleared FIRST and the notice comes LAST: refresh() opens with
      // clearMessages(), and if it throws, the canvas must still be gone —
      // leaving it live over a committed panel invites a second submit that
      // one-panel-per-member will refuse.
      strokes = [];
      canvasRoundKey = null;
      try { await refresh(); } catch { /* the next load reconciles the list */ }
      // If that refresh failed, the committed hand-off is missing locally and
      // progressOf would under-count it — skipping the host's nudge on the very
      // panel that finished the drawing, which is what this branch exists to
      // prevent. Put the row we know landed back before announcing.
      if (e.handoff && !handoffs.some((h) => h.id === e.handoff.id)) {
        handoffs = [...handoffs, e.handoff];
      }
      const landedRound = rounds.find((r) => r.id === e.roundId) ?? null;
      if (landedRound) announceSubmission(landedRound, e.position);
      else showNotice("Your panel is in.");
      return;
    }
    if (btn) { btn.disabled = false; btn.textContent = "Submit & pass on"; }
    showError(e.message);
  }
}

async function revealRound(roundId) {
  const stale = rounds.find((r) => r.id === roundId);
  if (!stale || !canManageRound(stale)) return showError("Only the host can reveal this drawing.");
  // Reveal is the one irreversible action here, and it was deciding on
  // whatever `handoffs` held at page load: a host with a tab open since before
  // anyone drew got a destructive "only 1 of 3 panels are in" warning about a
  // finished drawing, and the audience below missed every artist whose panel
  // landed after that load, so they were never told it had been revealed.
  let round = stale;
  try { round = (await refreshRoundState(roundId)) ?? stale; }
  catch (e) { return showError(e.message); }
  if (!canManageRound(round)) return showError("Only the host can reveal this drawing.");
  if (round.status !== "open" || round.archived) return showError("This drawing can't be revealed any more.");
  const { drawn, complete } = progressOf(round);
  if (drawn === 0) return showError("There's nothing to reveal yet — no panels have been drawn.");
  // Revealing before everyone has drawn is how a host ends a drawing early —
  // allowed, but it is the destructive one: whoever has not drawn never will.
  const early = !complete;
  const ok = await hubConfirm({
    message: early ? "Reveal now, before everyone has drawn?" : "Reveal the finished drawing?",
    description: early
      ? `${drawn} ${drawn === 1 ? "panel is" : "panels are"} in. Anyone who hasn't drawn yet loses their turn.`
      : `All ${drawn} ${drawn === 1 ? "panel" : "panels"} will be shown to the whole household at once.`,
    confirmLabel: "Reveal",
    destructive: early,
  });
  if (!ok) return;
  try {
    const at = nowIso();
    if (DB) await dbq("UPDATE app_exquisite_corpse__rounds SET status = 'revealed', revealed_at = ? WHERE id = ?", [at, roundId]);
    const idx = rounds.findIndex((r) => r.id === roundId);
    if (idx !== -1) rounds[idx] = { ...rounds[idx], status: "revealed", revealed_at: at };
    // The status flip is what releases every panel from sealed_until, so the
    // segments held locally are still just the host's own. Without re-reading,
    // the gallery this immediately renders shows one panel — or "No panels were
    // drawn" for a host who never drew — until someone hits Refresh.
    try { await refreshRoundState(roundId); } catch { /* the next load fills it in */ }
    showNotice("Revealed! Behold the exquisite corpse.");
    publish("exquisite_corpse.round_revealed", roundId, { title: round.title });
    // Everyone, not just the artists: the reveal is the payoff, and anyone who
    // didn't get a panel in — especially on an early reveal — is exactly who
    // would otherwise never hear that the drawing was finished.
    const audience = memberIds().filter((id) => id !== currentMember.id);
    if (audience.length) notify(audience, `Revealed: ${round.title}`, "The collaborative drawing is complete — come see it!", roundId);
  } catch (e) { showError(e.message); }
}

async function archiveRound(roundId) {
  const round = rounds.find((r) => r.id === roundId);
  if (!round || !canManageRound(round)) return showError("Only the host can archive this drawing.");
  const ok = await hubConfirm({
    message: "Archive this drawing?",
    description: "It moves to the archived list. Nothing is deleted.",
    confirmLabel: "Archive", destructive: true,
  });
  if (!ok) return;
  try {
    if (DB) await dbq("UPDATE app_exquisite_corpse__rounds SET archived = 1 WHERE id = ?", [roundId]);
    rounds = rounds.filter((r) => r.id !== roundId);
    selectedRoundId = null;
    showNotice("Drawing archived.");
  } catch (e) { showError(e.message); }
}

function publish(type, subjectId, payload) {
  fetch(EVENTS_URL, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ source_app_id: APP_ID, type, subject_id: subjectId, payload }),
  }).catch(() => {});
}

function notify(audience, title, body, roundId) {
  sendHubNotification({ title, body, audience, url: hubAppUrl(APP_ID, { roundId }) }).catch(() => {});
}

// ── Canvas ────────────────────────────────────────────────────────────────────
function ghostConnectorsFor(round) {
  // Mid-drawing: the marks this canvas was baselined against, frozen. Before
  // the first stroke: whatever is on top right now, so the artist always starts
  // from current state.
  // `rebaselineOnNextStroke` means the artist has just been shown that the
  // marks moved and chose to keep drawing — so the CURRENT marks go up now,
  // which is what the dialog promised. The baseline catches up on their next
  // stroke, keeping "the baseline is the ghost on screen" true from then on;
  // until they draw, submitting again re-asks, which is the point.
  const frozen = strokes.length > 0 && canvasRoundKey === round.id && !rebaselineOnNextStroke;
  return frozen ? canvasGhost : lastConnectors(handoffs, round.id);
}

function redrawCanvas(round) {
  const canvas = document.getElementById("draw");
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  const w = canvas.clientWidth, h = round.panel_height;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const dpr = window.devicePixelRatio || 1;
  ctx.scale(dpr, dpr);
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, w, h);

  // ghost hand-off marks from the previous artist along the TOP edge
  for (const c of ghostConnectorsFor(round)) {
    const x = Math.min(1, Math.max(0, Number(c.x))) * w;
    ctx.strokeStyle = c.color || "#a78bfa";
    ctx.globalAlpha = 0.4;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, 16);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  for (const stroke of strokes) drawStroke(ctx, stroke);
}

// Records the state this canvas is answering: how many panels there were and
// which hand-off was above. Called at the first stroke, and again whenever the
// artist is shown newer marks and chooses to keep drawing — without that
// second call the "a panel arrived" prompt fires again on every retry, with no
// way to satisfy it.
function sampleCanvasBaseline(roundId) {
  canvasDrawnAgainst = panelCount(handoffs, roundId);
  canvasDrawnAgainstId = topHandoffId(handoffs, roundId);
  canvasGhost = lastConnectors(handoffs, roundId);
  rebaselineOnNextStroke = false;
}

function drawStroke(ctx, stroke) {
  if (!stroke.points.length) return;
  ctx.strokeStyle = stroke.erase ? "#ffffff" : stroke.color;
  ctx.lineWidth = stroke.size;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.beginPath();
  ctx.moveTo(stroke.points[0].x, stroke.points[0].y);
  for (const p of stroke.points.slice(1)) ctx.lineTo(p.x, p.y);
  ctx.stroke();
}

function setupCanvas(round) {
  const canvas = document.getElementById("draw");
  if (!canvas) return;
  if (canvasRoundKey !== round.id) { strokes = []; canvasRoundKey = round.id; }

  const w = canvas.clientWidth, h = round.panel_height;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.height = `${h}px`;
  redrawCanvas(round);

  const pos = (e) => {
    const r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  };
  canvas.onpointerdown = (e) => {
    e.preventDefault();
    // First stroke on a blank canvas — or the first stroke after the artist was
    // shown newer marks and chose to keep drawing. Clear and Undo-to-empty come
    // back through the first branch, so they resample too.
    if (!strokes.length || rebaselineOnNextStroke) {
      sampleCanvasBaseline(round.id);
      rebaselineOnNextStroke = false;
    }
    canvas.setPointerCapture(e.pointerId);
    activeStroke = { points: [pos(e)], color: penColor, size: tool === "eraser" ? penSize * 2.4 : penSize, erase: tool === "eraser" };
    strokes.push(activeStroke);
    redrawCanvas(round);
  };
  canvas.onpointermove = (e) => {
    if (!activeStroke) return;
    const p = pos(e);
    const last = activeStroke.points[activeStroke.points.length - 1];
    if (Math.hypot(p.x - last.x, p.y - last.y) < 1.4) return;
    activeStroke.points.push(p);
    const ctx = canvas.getContext("2d");
    drawStroke(ctx, activeStroke);
  };
  const end = () => { activeStroke = null; };
  canvas.onpointerup = end;
  canvas.onpointercancel = end;
  canvas.onpointerleave = end;
}

function undoStroke() {
  const round = selectedRound();
  if (!strokes.length || !round) return;
  strokes.pop();
  redrawCanvas(round);
}
function clearCanvas() {
  const round = selectedRound();
  strokes = [];
  if (round) redrawCanvas(round);
}
function setTool(t) { tool = t; render(); }
function setColor(c) { penColor = c; tool = "pen"; render(); }
function setSize(s) { penSize = s; render(); }

// ── Render ────────────────────────────────────────────────────────────────────
function renderMessages() {
  return `${error ? `<div class="error">${esc(error)}</div>` : ""}${notice ? `<div class="notice">${esc(notice)}</div>` : ""}`;
}

function statusPill(round) {
  const { drawn, complete } = progressOf(round);
  if (round.status === "revealed") return `<span class="pill good" data-testid="round-status">Revealed</span>`;
  // Before `complete`: an archived round is closed for good, and offering
  // "Ready to reveal" next to no reveal button is the worse kind of wrong.
  if (round.archived) return `<span class="pill" data-testid="round-status">Archived</span>`;
  if (canSubmit(round)) return `<span class="pill info" data-testid="round-status">Add your panel</span>`;
  // Everyone has drawn: it will take no more panels, so a count reads as
  // still-going for something that is finished. Name the state instead.
  if (complete) return `<span class="pill good" data-testid="round-status">Ready to reveal</span>`;
  return `<span class="pill warn" data-testid="round-status">${drawn} ${drawn === 1 ? "panel" : "panels"}</span>`;
}

function renderRoundCard(round) {
  return `
    <article class="card round-card" data-testid="round-card" data-round-id="${esc(round.id)}" data-open="${esc(round.id)}">
      <div class="head">
        <div>
          <div class="title">${esc(round.title)}</div>
          <div class="meta">${round.theme ? `${esc(round.theme)} · ` : ""}Hosted by ${esc(round.created_by_name)}</div>
        </div>
        ${statusPill(round)}
      </div>
    </article>`;
}

function renderList() {
  return `
    <div class="topbar">
      <div>
        <h1>🎨 Exquisite Corpse</h1>
        <p class="muted tiny">Draw a panel, pass it on. Nobody sees the whole thing until the big reveal.</p>
      </div>
      <button class="btn" data-testid="new-round" data-view-create>Start one</button>
    </div>
    ${renderMessages()}
    <div class="section-head">
      <h2>${showArchived ? "Archived" : "Drawings"}</h2>
      <div class="actions">
        <button class="btn btn-quiet" data-toggle-archived>${showArchived ? "Show active" : "Show archived"}</button>
        <button class="btn btn-ghost btn-sm" data-refresh>Refresh</button>
      </div>
    </div>
    ${visibleRounds().length ? `<div class="search-row"><input id="search" class="search-input" type="search" data-testid="search-input" placeholder="Search drawings…" aria-label="Search drawings" value="${esc(searchQ)}" /></div>` : ""}
    <section class="stack" id="round-list" data-testid="round-list">
      ${renderRoundList()}
    </section>`;
}

// Owns the filtering and the empty states, so the keystroke handler can refresh
// the list without repeating how it is derived.
// `loadData` already queries with the archived filter, but a round re-read
// mid-submit can change its archived state in place. Filtering here as well
// means the list is right either way without anything having to evict rows.
function visibleRounds() {
  return rounds.filter((r) => Number(r.archived ?? 0) === (showArchived ? 1 : 0));
}

function renderRoundList() {
  const all = visibleRounds();
  const shown = searchQ ? all.filter(r => searchMatch(searchQ, searchableFields(r))) : all;
  if (shown.length) return shown.map(renderRoundCard).join("");
  if (searchQ) return `<div class="card empty">No drawings match "${esc(searchQ)}".</div>`;
  return `<div class="card empty">${showArchived ? "Nothing archived." : "No drawings yet — start the first one!"}</div>`;
}

document.addEventListener("input", (e) => {
  if (e.target.id !== "search") return;
  searchQ = e.target.value;
  const el = document.getElementById("round-list");
  if (el) el.innerHTML = renderRoundList();
});

// Who has put a panel in, and who has not. Built from `handoffs` — the only
// per-artist record an artist is allowed to read while the round is open. It
// names people, never their drawings.
function renderRoster(round) {
  const drawnIds = artistIds(handoffs, round.id);
  const waiting = members.filter((m) => !drawnIds.includes(m.id));
  const row = (id, done) => `
    <div class="roster-row" data-testid="artist-row" data-member-id="${esc(id)}" data-drawn="${done ? "1" : "0"}">
      <span class="dot ${done ? "done" : ""}"></span>
      <span class="avatar" style="background:${esc(memberColor(id, members))}">${esc(initial(memberName(id)))}</span>
      <span>${esc(memberName(id))}</span>
      ${done ? `<span class="pill good tiny">drawn</span>` : `<span class="pill tiny">not yet</span>`}
    </div>`;
  return `
    <div class="roster" data-testid="artist-roster">
      ${drawnIds.map((id) => row(id, true)).join("")}
      ${waiting.map((m) => row(m.id, false)).join("")}
    </div>`;
}

function renderToolbar() {
  return `
    <div class="tools">
      <div class="swatches">
        ${PALETTE.map((c) => `<button class="swatch ${tool === "pen" && penColor === c ? "on" : ""}" style="background:${c}" data-color="${c}" aria-label="color"></button>`).join("")}
      </div>
      <div class="sizes">
        ${SIZES.map((s) => `<button class="size-btn ${penSize === s ? "on" : ""}" data-size="${s}"><span class="size-dot" style="width:${s}px;height:${s}px"></span></button>`).join("")}
      </div>
      <button class="btn btn-ghost btn-sm ${tool === "eraser" ? "on" : ""}" data-tool="${tool === "eraser" ? "pen" : "eraser"}">${tool === "eraser" ? "Pen" : "Eraser"}</button>
      <button class="btn btn-ghost btn-sm" data-undo>Undo</button>
      <button class="btn btn-ghost btn-sm" data-clear>Clear</button>
    </div>`;
}

function renderPlay(round) {
  const { drawn, complete } = progressOf(round);
  const mine = mySegment(segments, round, currentMember);

  let body;
  if (canSubmit(round)) {
    const ghost = ghostConnectorsFor(round).length;
    body = `
      ${drawn > 0
        ? `<div class="hint">You're picking up the drawing. The faint violet ticks at the top show where the last artist's lines cross over — continue them, then draw the rest of your panel however you like.</div>`
        : `<div class="hint">You're starting the drawing! When you finish, leave a few lines running off the bottom edge — that's the only clue the next artist gets.</div>`}
      <div class="canvas-wrap"><canvas id="draw" data-testid="draw-canvas"></canvas></div>
      ${renderToolbar()}
      <div class="actions">
        <button class="btn" id="submit-btn" data-testid="submit-panel" data-submit>Submit & pass on</button>
        <span class="muted tiny">${ghost ? "Continue the violet ticks up top." : "Draw freely."}</span>
      </div>`;
  } else if (mine) {
    body = `
      <div class="hint" data-testid="panel-sealed">${round.archived
        ? "This drawing was archived before it was revealed, so your panel stays sealed."
        : "Your panel is locked in and sealed — you'll see everyone's work when the host reveals it."}</div>
      <div class="gallery"><div class="panel"><img src="${esc(mine.file_url)}" alt="your panel" /><div class="panel-by">Your panel · position ${Number(mine.position) + 1}</div></div></div>`;
  } else if (round.archived) {
    // Before `complete`: an archived round has no reveal button, so telling
    // anyone it is waiting to be revealed is the same wrongness statusPill
    // just stopped committing.
    body = `<div class="empty" data-testid="round-closed">This drawing is archived. Nothing more can be added.</div>`;
  } else {
    // No "the round is full" state any more: complete means everyone on the
    // roster has drawn, which includes whoever is reading, so they land in the
    // `mine` branch above. This is the fallback for a viewer the roster does
    // not name — and for a round that is simply no longer open.
    body = `<div class="empty" data-testid="round-closed">This drawing isn't taking panels right now.</div>`;
  }

  return `
    <section class="card stack">
      <div class="head">
        <div>
          <h1>${esc(round.title)}</h1>
          <p class="muted" data-testid="panel-progress">${round.theme ? `${esc(round.theme)} · ` : ""}${drawn} ${drawn === 1 ? "panel" : "panels"} drawn${complete ? " · everyone has drawn" : ""}</p>
        </div>
        <div class="actions">
          ${canReveal(round) ? `<button class="btn btn-sm" data-testid="reveal-round" data-reveal="${esc(round.id)}">${complete ? "Reveal" : "Reveal early"}</button>` : ""}
          ${canManageRound(round) ? `<button class="btn btn-quiet" data-testid="archive-round" data-archive="${esc(round.id)}">Archive</button>` : ""}
        </div>
      </div>
      ${renderRoster(round)}
    </section>
    <section class="card stack">${body}</section>`;
}

function renderReveal(round) {
  const segs = roundSegments(round.id);
  return `
    <section class="card stack">
      <div class="head">
        <div>
          <h1>${esc(round.title)}</h1>
          <p class="muted">${round.theme ? `${esc(round.theme)} · ` : ""}Revealed ${esc(fmtWhen(round.revealed_at))}</p>
        </div>
        ${canManageRound(round) ? `<button class="btn btn-quiet" data-archive="${esc(round.id)}">Archive</button>` : ""}
      </div>
    </section>
    <section class="card">
      <h2>The finished corpse</h2>
      ${segs.length
        ? `<div class="gallery" data-testid="reveal-gallery">${segs.map((s) => `
            <div class="panel" data-testid="reveal-panel" data-member-id="${esc(s.member_id)}">
              <img src="${esc(s.file_url)}" alt="panel by ${esc(s.member_name)}" />
              <div class="panel-by">${esc(s.member_name)}</div>
            </div>`).join("")}</div>`
        : `<div class="empty">No panels were drawn.</div>`}
    </section>`;
}

function renderDetail() {
  const round = selectedRound();
  if (!round) return renderList();
  return `
    <button class="btn btn-ghost btn-sm back" data-back>Back</button>
    ${renderMessages()}
    ${round.status === "revealed" ? renderReveal(round) : renderPlay(round)}`;
}

function renderCreate() {
  return `
    <button class="btn btn-ghost btn-sm back" data-view-list>Back</button>
    <div class="topbar"><h1>Start a drawing</h1></div>
    ${renderMessages()}
    <form class="card form" id="create-form" data-testid="round-form">
      <div class="field">
        <label for="title">Title</label>
        <input id="title" name="title" data-testid="field-title" placeholder="The Beast of Maple Street" required />
      </div>
      <div class="field">
        <label for="theme">Theme <span class="muted tiny" style="text-transform:none">(optional)</span></label>
        <input id="theme" name="theme" data-testid="field-theme" placeholder="A creature nobody has seen" />
      </div>
      <div class="field">
        <p class="muted tiny">Anyone in the household can add a panel, one each, in whatever order people are ready. The drawing is done when everyone has drawn — or whenever you decide to reveal it.</p>
      </div>
      <div class="actions">
        <button class="btn" type="submit" data-testid="round-submit">Start drawing</button>
      </div>
    </form>`;
}

function render() {
  const root = document.getElementById("root");
  root.className = "app";
  root.innerHTML = selectedRoundId ? renderDetail() : view === "create" ? renderCreate() : renderList();
  const round = selectedRound();
  if (round && round.status !== "revealed" && canSubmit(round)) setupCanvas(round);
}

// ── Events ────────────────────────────────────────────────────────────────────
document.addEventListener("click", (e) => {
  const t = e.target.closest("button, [data-open]");
  if (!t) return;
  const open = t.getAttribute("data-open");
  if (open) {
    selectedRoundId = open;
    clearMessages();
    render();
    // Bring the round up to date behind the render, so the reveal button, the
    // roster and the canvas baseline all reflect what is actually there rather
    // than whatever the last full load saw.
    refreshRoundState(open).then(render).catch(() => {});
    return;
  }
  if (t.matches("[data-back], [data-view-list]")) { selectedRoundId = null; view = "list"; clearMessages(); render(); return; }
  if (t.matches("[data-view-create]")) { view = "create"; clearMessages(); render(); return; }
  if (t.matches("[data-refresh]")) { refresh(); return; }
  if (t.matches("[data-toggle-archived]")) { showArchived = !showArchived; refresh(); return; }
  if (t.hasAttribute("data-color")) { setColor(t.getAttribute("data-color")); return; }
  if (t.hasAttribute("data-size")) { setSize(Number(t.getAttribute("data-size"))); return; }
  if (t.hasAttribute("data-tool")) { setTool(t.getAttribute("data-tool")); return; }
  if (t.hasAttribute("data-undo")) { undoStroke(); return; }
  if (t.hasAttribute("data-clear")) { clearCanvas(); return; }
  if (t.hasAttribute("data-submit")) { submitSegment(); return; }
  if (t.hasAttribute("data-reveal")) { revealRound(t.getAttribute("data-reveal")); return; }
  if (t.hasAttribute("data-archive")) { archiveRound(t.getAttribute("data-archive")); return; }
});

document.addEventListener("submit", (e) => {
  if (e.target.id !== "create-form") return;
  e.preventDefault();
  createRound(e.target);
});

function handleDeepLink() {
  const roundId = new URLSearchParams(window.location.search).get("roundId");
  if (roundId && rounds.some((r) => r.id === roundId)) selectedRoundId = roundId;
}

(async () => {
  await loadMembers();
  await loadData().catch((e) => { error = e.message; });
  handleDeepLink();
  render();
})();
</script>
</body>
</html>
